name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Jobbene trenger bare å lese koden.
permissions:
  contents: read

jobs:
  check:
    name: Typekontroll, lint, enhetstester og bygg
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kundepriser_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kundepriser_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Skjema og migrasjoner stemmer overens
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kundepriser_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/kundepriser_test
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE DATABASE kundepriser_shadow'
          npx prisma validate
          npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url postgresql://postgres:postgres@localhost:5432/kundepriser_shadow --exit-code
      - name: Sårbarhetssjekk av avhengigheter (varsler, stopper ikke)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
      - name: Enhetstester (Postgres)
        run: npm test
      - name: Produksjonsbygg
        run: npm run build

  e2e:
    name: Ende-til-ende (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kundepriser_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kundepriser_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-feilsoking
          path: test-results/
          retention-days: 7
